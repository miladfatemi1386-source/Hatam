<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <!-- ==========================================
    META TAGS - تنظیمات پایه سند
    ========================================== -->
    <meta charset="UTF-8"> <!-- رمزگذاری فارسی -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- واکنش‌گرایی -->
    <title>منوی ویژه حاتم</title> <!-- عنوان برگه مرورگر -->

    <!-- ==========================================
    STYLESHEETS - لینک به فایل‌های سبک
    ========================================== -->
    <style>
/* ==========================================
   RESET & BASE - ریست و تنظیمات پایه
========================================== */
* {
    margin: 0;                 /* حذف حاشیه پیش‌فرض */
    padding: 0;                /* حذف فاصله داخلی پیش‌فرض */
    box-sizing: border-box;    /* محاسبه عرض شامل padding و border */
}

/* ==========================================
   BODY - بدنه اصلی صفحه
========================================== */
body {
    width: 100%;                          /* عرض کامل صفحه */
    min-height: 100vh;                    /* حداقل ارتفاع برابر viewport */
    display: flex;                        /* چیدمان فلکس */
    flex-direction: column;               /* ترتیب عمودی */
    align-items: center;                  /* وسط‌چین افقی */
    background-color: #f5efe7;            /* رنگ پس‌زمینه کرم */
    animation: fadeIn 2s ease;            /* انیمیشن محو شدن در بارگذاری */
    overflow-x: hidden;                   /* جلوگیری از اسکرول افقی */
    font-family: "Estedad", sans-serif;   /* فونت پیش‌فرض */
}

/* ==========================================
   FONT FACES - تعریف فونت‌های سفارشی
========================================== */
@font-face {
    font-family: "Estedad";               /* نام فونت */
    src: url("../Fonts/Estedad-Bold.woff2") format("woff2"); /* مسیر فایل */
    font-display: swap;                   /* نمایش سریع‌تر */
}

@font-face {
    font-family: "Colack";
    src: url("../Fonts/ColakFAnum.woff2") format("woff2");
    font-display: swap;
}

@font-face {
    font-family: "Morabba";
    src: url("../Fonts/Morabba-Bold.woff2") format("woff2");
    font-display: swap;
}

@font-face {
    font-family: "Abr";
    src: url("../Fonts/AbarLow-Black.woff2") format("woff2");
    font-display: swap;
}

@font-face {
    font-family: "AbrBold";               /* فونت ضخیم برای عنوان‌ها */
    src: url("../Fonts/AbarHigh-ExtraBold.woff2") format("woff2");
    font-display: swap;
}

/* ==========================================
   WRAPPER - کانتینر اصلی تمام محتوا
========================================== */
.site-wrapper {
    flex: 1;                              /* کشیده شدن برای پر کردن فضا */
    width: 100%;                          /* عرض کامل */
    max-width: 1000px;                    /* حداکثر عرض */
    display: flex;                        /* چیدمان فلکس */
    flex-direction: column;               /* ترتیب عمودی */
    padding-bottom: 60px;                 /* فاصله از پایین صفحه - آخرین آیتم نچسبد */
}

/* ==========================================
   HEADER - سرصفحه (لوگو و بنر)
========================================== */
.site-header {
    width: 100%;                          /* عرض کامل */
    display: flex;                        /* چیدمان فلکس */
    flex-direction: column;               /* عمودی */
    align-items: center;                  /* وسط‌چین */
    margin: 0 auto;                       /* مرکز قرارگیری */
}

.header-logo {
    width: 450px;                         /* عرض لوگو */
    height: auto;                         /* ارتفاع متناسب */
    margin-top: -35px;                    /* جابجایی به سمت بالا */
    display: block;                       /* نمایش بلوکی */
}

.header-banner {
    width: 550px;                         /* عرض بنر */
    height: auto;                         /* ارتفاع متناسب */
    margin-top: -35px;                    /* چسبیدن به لوگو */
    margin-bottom: 35px;                  /* فاصله از بخش بعد */
    display: block;                       /* نمایش بلوکی */
}

/* ==========================================
   INFO BAR - نوار اطلاعات تماس
========================================== */
.info-bar {
    width: 100%;                          /* عرض کامل */
    display: flex;                        /* چیدمان فلکس */
    justify-content: center;              /* وسط‌چین افقی */
    align-items: center;                  /* وسط‌چین عمودی */
    gap: 15px;                            /* فاصله بین آیتم‌ها */
    margin: 35px auto;                    /* فاصله از اطراف */
}

.info-link {
    flex: 1;                              /* تقسیم فضای مساوی */
    display: block;                       /* نمایش بلوکی */
    text-decoration: none;                /* حذف زیرخط */
    transition: all 0.3s ease;            /* انیمیشن هاور */
}

/* هاور روی لینک‌های اطلاعات */
.info-link:hover {
    transform: scale(1.03);               /* بزرگنمایی کل کادر */
}

.info-icon {
    width: 100%;                          /* عرض کامل ظرف */
    height: auto;                         /* ارتفاع متناسب */
    display: block;                       /* نمایش بلوکی */
    transition: all 0.3s ease;            /* انیمیشن هاور */
    border-radius: 12px;                  /* گوشه‌های گرد */
}

/* هاور روی آیکون‌های اطلاعات */
.info-icon:hover {
    transform: scale(1.02);               /* بزرگنمایی جزئی */
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12); /* سایه نرم */
    filter: brightness(0.97);             /* کمی تیره‌تر */
}

/* ==========================================
   MENU GRID - شبکه منوها
========================================== */
.menu-grid {
    width: 100%;                          /* عرض کامل */
    display: flex;                        /* چیدمان فلکس */
    flex-direction: column;               /* ترتیب عمودی */
    gap: 30px;                            /* فاصله بین آیتم‌ها */
    flex: 1;                              /* کشیده شدن برای پر کردن فضا */
}

/* ==========================================
   MENU CARD - کارت هر منو
========================================== */
.menu-card {
    width: 100%;                          /* عرض کامل */
    height: auto;                         /* ارتفاع متناسب */
    position: relative;                   /* برای فرزندان مطلق */
}

/* ==========================================
   MENU CARD SPECIFIC - کلاس‌های اختصاصی هر منو
========================================== */

/* ----- چلو کباب ویژه ----- */
.image--chelokabab {
    width: 100%;                          /* عرض کامل */
    height: auto;                         /* ارتفاع متناسب */
    display: block;                       /* نمایش بلوکی (رفع فاصله اضافی) */
    border-radius: 12px;                  /* گوشه‌های گرد */
    transition: all 0.3s ease;            /* انیمیشن هاور */
}

.image--chelokabab:hover {
    transform: scale(1.01);               /* بزرگنمایی جزئی */
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1); /* سایه نرم */
}

/* ----- چلو جوجه ویژه ----- */
.image--chelojoje {
    width: 100%;                          /* عرض کامل */
    height: auto;                         /* ارتفاع متناسب */
    display: block;                       /* نمایش بلوکی (رفع فاصله اضافی) */
    border-radius: 12px;                  /* گوشه‌های گرد */
    transition: all 0.3s ease;            /* انیمیشن هاور */
}

.image--chelojoje:hover {
    transform: scale(1.01);               /* بزرگنمایی جزئی */
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1); /* سایه نرم */
}

/* ----- چلو وزیری ویژه ----- */
.image--chelovaziri {
    width: 100%;                          /* عرض کامل */
    height: auto;                         /* ارتفاع متناسب */
    display: block;                       /* نمایش بلوکی (رفع فاصله اضافی) */
    border-radius: 12px;                  /* گوشه‌های گرد */
    transition: all 0.3s ease;            /* انیمیشن هاور */
}

.image--chelovaziri:hover {
    transform: scale(1.01);               /* بزرگنمایی جزئی */
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1); /* سایه نرم */
}

/* ----- چلو مرغ سینه ویژه ----- */
.image--chelomorghsine {
    width: 100%;                          /* عرض کامل */
    height: auto;                         /* ارتفاع متناسب */
    display: block;                       /* نمایش بلوکی (رفع فاصله اضافی) */
    border-radius: 12px;                  /* گوشه‌های گرد */
    transition: all 0.3s ease;            /* انیمیشن هاور */
}

.image--chelomorghsine:hover {
    transform: scale(1.01);               /* بزرگنمایی جزئی */
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1); /* سایه نرم */
}

/* ----- چلو مرغ ران ویژه ----- */
.image--chelomorghran {
    width: 100%;                          /* عرض کامل */
    height: auto;                         /* ارتفاع متناسب */
    display: block;                       /* نمایش بلوکی (رفع فاصله اضافی) */
    border-radius: 12px;                  /* گوشه‌های گرد */
    transition: all 0.3s ease;            /* انیمیشن هاور */
}

.image--chelomorghran:hover {
    transform: scale(1.01);               /* بزرگنمایی جزئی */
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1); /* سایه نرم */
}

/* ==========================================
   BACK BUTTON - دکمه بازگشت
========================================== */
.back-button {
    width: 100%;                          /* عرض کامل */
    max-width: 1000px;                    /* حداکثر عرض */
    margin: 20px auto 0;                  /* فاصله از بالا */
    display: flex;                        /* چیدمان فلکس */
    justify-content: center;              /* وسط‌چین افقی */
}

.back-button__link {
    display: block;                       /* نمایش بلوکی */
    text-decoration: none;                /* حذف زیرخط */
    width: 70%;                           /* عرض ۷۰ درصد */
    transition: transform 0.3s ease;      /* انیمیشن هاور */
}

.back-button__link:hover {
    transform: scale(1.02);               /* بزرگنمایی جزئی در هاور */
}

.back-button__image {
    width: 100%;                          /* عرض کامل */
    height: auto;                         /* ارتفاع متناسب */
    display: block;                       /* نمایش بلوکی */
    border-radius: 12px;                  /* گوشه‌های گرد */
    transition: all 0.3s ease;            /* انیمیشن هاور */
}

/* هاور روی دکمه بازگشت */
.back-button__image:hover {
    transform: scale(1.02);               /* بزرگنمایی جزئی */
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1); /* سایه نرم */
}

/* ==========================================
   ANIMATIONS - انیمیشن‌ها
========================================== */
@keyframes fadeIn {
    from {
        opacity: 0;                        /* شروع: مخفی */
        transform: translateY(15px);       /* پایین‌تر */
    }
    to {
        opacity: 1;                        /* پایان: قابل مشاهده */
        transform: translateY(0);          /* موقعیت اصلی */
    }
}

/* ==========================================
   RESPONSIVE - واکنش‌گرایی
========================================== */

/* === تبلت و صفحه‌های متوسط === */
@media (max-width: 768px) {
    .header-logo {
        width: 200px;                      /* کاهش لوگو */
        margin-top: -20px;
    }
    
    .header-banner {
        width: 300px;                      /* کاهش بنر */
        margin-top: -20px;
        margin-bottom: 20px;
    }

    .info-bar {
        gap: 10px;                         /* کاهش فاصله */
        margin: 20px auto;
    }

    .site-wrapper {
        padding-bottom: 40px;              /* کاهش فاصله پایین */
    }

    .menu-grid {
        gap: 20px;                         /* کاهش فاصله بین منوها */
    }

    .back-button__link {
        width: 80%;                        /* افزایش عرض دکمه بازگشت */
    }

    /* کاهش گردی گوشه‌ها در تبلت */
    .image--chelokabab,
    .image--chelojoje,
    .image--chelovaziri,
    .image--chelomorghsine,
    .image--chelomorghran,
    .back-button__image,
    .info-icon {
        border-radius: 10px;
    }
}

/* === موبایل و صفحه‌های کوچک === */
@media (max-width: 480px) {
    .header-logo {
        width: 140px;                      /* کاهش بیشتر لوگو */
        margin-top: -10px;
    }
    
    .header-banner {
        width: 200px;                      /* کاهش بیشتر بنر */
        margin-top: -10px;
        margin-bottom: 15px;
    }

    .info-bar {
        gap: 8px;                          /* فاصله کمتر */
        margin: 15px auto;
    }

    .menu-grid {
        gap: 15px;                         /* فاصله کمتر بین منوها */
    }

    .site-wrapper {
        padding-bottom: 30px;              /* کاهش فاصله پایین برای موبایل */
    }

    .back-button__link {
        width: 90%;                        /* افزایش بیشتر عرض دکمه بازگشت */
    }

    /* کاهش گردی گوشه‌ها در موبایل */
    .image--chelokabab,
    .image--chelojoje,
    .image--chelovaziri,
    .image--chelomorghsine,
    .image--chelomorghran,
    .back-button__image,
    .info-icon {
        border-radius: 8px;
    }
}
    </style>
