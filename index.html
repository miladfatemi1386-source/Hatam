    <style>
/* ==========================================
   RESET & BASE - ریست و تنظیمات پایه
========================================== */
* {
    margin: 0;                 /* حذف حاشیه پیش‌فرض */
    padding: 0;                /* حذف فاصله داخلی پیش‌فرض */
    box-sizing: border-box;    /* محاسبه عرض شامل padding و border */
}

/* ==========================================
   BODY - بدنه اصلی صفحه
========================================== */
body {

    display: flex;                        /* چیدمان فلکس */

/* ==========================================
   HEADER - سرصفحه (لوگو و بنر)
========================================== */
.site-header {

.header-logo {

    margin-top: clamp(-16px, -5cqw, -35px); /* جابجایی به سمت بالا */
    display: block;                       /* نمایش بلوکی */
}

/* ==========================================
   HEADER TITLE - عنوان «منوی رستوران حاتم» (جایگزین کد‌ی تصویر)
========================================== */
.header-title {
    display: flex;
    align-items: center;

    margin-top: -10px;
    margin-bottom: clamp(16px, 4cqw, 35px);
}

.header-title__line {

    width: clamp(24px, 8cqw, 70px);

}

.header-title__text {

    font-size: clamp(17px, 4.6cqw, 30px);
    color: #1f3555;
    white-space: nowrap;
}

/* ==========================================
   TICKET NOTCH SHAPE - شکل بلیطی با گوشه‌های بریده
   (استفاده مشترک در info-icon و menu-card__box)
========================================== */
.ticket {
    --notch: clamp(9px, 2.6cqw, 16px);
    --gap: clamp(2px, 0.8cqw, 4px);
    position: relative;
    display: block;
    width: 100%;
    background: #1f3555;
    padding: var(--gap);
    box-sizing: border-box;
    clip-path: polygon(
        var(--notch) 0%, calc(100% - var(--notch)) 0%,
        calc(100% - var(--notch)) var(--notch), 100% var(--notch),
        100% calc(100% - var(--notch)), calc(100% - var(--notch)) calc(100% - var(--notch)),
        calc(100% - var(--notch)) 100%, var(--notch) 100%,
        var(--notch) calc(100% - var(--notch)), 0% calc(100% - var(--notch)),
        0% var(--notch), var(--notch) var(--notch)
    );
    transition: transform 0.25s ease, filter 0.25s ease;
}

.ticket__inner {
    display: block;
    background: #fff;
    padding: var(--gap);
    box-sizing: border-box;
    clip-path: polygon(
        var(--notch) 0%, calc(100% - var(--notch)) 0%,
        calc(100% - var(--notch)) var(--notch), 100% var(--notch),
        100% calc(100% - var(--notch)), calc(100% - var(--notch)) calc(100% - var(--notch)),
        calc(100% - var(--notch)) 100%, var(--notch) 100%,
        var(--notch) calc(100% - var(--notch)), 0% calc(100% - var(--notch)),
        0% var(--notch), var(--notch) var(--notch)
    );
}

.ticket__gold {
    border: 1.4px solid #b28f57;
    clip-path: polygon(
        var(--notch) 0%, calc(100% - var(--notch)) 0%,
        calc(100% - var(--notch)) var(--notch), 100% var(--notch),
        100% calc(100% - var(--notch)), calc(100% - var(--notch)) calc(100% - var(--notch)),
        calc(100% - var(--notch)) 100%, var(--notch) 100%,
        var(--notch) calc(100% - var(--notch)), 0% calc(100% - var(--notch)),
        0% var(--notch), var(--notch) var(--notch)
    );
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

/* ==========================================
   INFO BAR - نوار اطلاعات تماس (ساخته‌شده با کد به‌جای تصویر)
========================================== */
.info-bar {
    width: 100%;                          /* عرض کامل */
    display: flex;                        /* چیدمان فلکس */
    justify-content: center;              /* وسط‌چین افقی */
    align-items: stretch;                 /* هم‌ارتفاع کردن کادرها */
    gap: clamp(8px, 2.5cqw, 15px);         /* فاصله بین آیتم‌ها */
    margin: clamp(18px, 4cqw, 35px) auto;  /* فاصله از اطراف */
}

.info-link {
    flex: 1;                              /* تقسیم فضای مساوی */
    display: block;                       /* نمایش بلوکی */
    text-decoration: none;                /* حذف زیرخط */
    min-width: 0;                         /* اجازه‌ی جمع‌شدن در فلکس */
}

/* هاور روی لینک‌های اطلاعات */
.info-link:hover .ticket {
    transform: scale(1.03);               /* بزرگنمایی */
    filter: brightness(0.97);
}

.info-icon.ticket__gold {
    flex-direction: row;
    gap: clamp(4px, 1.5cqw, 8px);
    min-height: clamp(52px, 13cqw, 78px);
    padding: clamp(6px, 2cqw, 12px);
}

.info-icon svg {
    width: clamp(14px, 4cqw, 20px);
    height: clamp(14px, 4cqw, 20px);
    flex-shrink: 0;
    stroke: #b28f57;
}

.info-icon span {
    font-family: "AbrBold", "Estedad", sans-serif;
    color: #1f3555;
    font-size: clamp(10px, 2.6cqw, 14px);
    line-height: 1.5;
    text-align: center;
    white-space: nowrap;
}

/* ==========================================
   MENU GRID - شبکه منوها
========================================== */
.menu-grid {
    width: 100%;                          /* عرض کامل */
    display: flex;                        /* چیدمان فلکس */
    flex-direction: column;               /* ترتیب عمودی */
    gap: clamp(16px, 4cqw, 30px);          /* فاصله بین آیتم‌ها */
    flex: 1;                              /* کشیده شدن برای پر کردن فضا */
}

/* ==========================================
   MENU CARD - کارت هر منو (ساخته‌شده با کد به‌جای تصویر)
========================================== */
.menu-card {
    width: 100%;                          /* عرض کامل */
    height: auto;                         /* ارتفاع متناسب */
}

.menu-card__link {
    display: block;                       /* نمایش بلوکی */
    text-decoration: none;                /* حذف زیرخط */
}

.menu-card__link:hover .ticket {
    transform: scale(1.01);
    filter: brightness(0.98);
}

.menu-card__box.ticket__gold {
    min-height: clamp(56px, 14cqw, 90px);
    padding: clamp(8px, 2cqw, 14px) clamp(16px, 4cqw, 28px);
    position: relative;
}

.menu-card__arrow {
    position: absolute;
    right: clamp(14px, 4cqw, 28px);
    top: 50%;
    transform: translateY(-50%);
    width: clamp(28px, 7cqw, 40px);
    height: clamp(28px, 7cqw, 40px);
    border-radius: 50%;
    background: #1f3555;
    border: clamp(1.5px, 0.6cqw, 2.5px) solid #b28f57;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.menu-card__arrow svg {
    width: clamp(10px, 2.6cqw, 14px);
    height: clamp(10px, 2.6cqw, 14px);
    stroke: #b28f57;
    /* فلش به‌سمت راست برای دکمه‌ی "بعدی" در چیدمان راست‌به‌چپ */
    transform: rotate(180deg);
}

.menu-card__title {
    font-family: "AbrBold", "Estedad", sans-serif;
    font-size: clamp(14px, 4cqw, 24px);
    color: #1f3555;
    display: flex;
    align-items: center;
    gap: clamp(6px, 1.5cqw, 10px);
    white-space: nowrap;
}

.menu-card__title::before,
.menu-card__title::after {
    content: "✦";
    color: #b28f57;
    font-size: clamp(9px, 2cqw, 14px);
}

/* ==========================================
   ANIMATIONS - انیمیشن‌ها
========================================== */
@keyframes fadeIn {
    from {
        opacity: 0;                        /* شروع: مخفی */
        transform: translateY(15px);       /* پایین‌تر */
    }
    to {
        opacity: 1;                        /* پایان: قابل مشاهده */
        transform: translateY(0);          /* موقعیت اصلی */
    }
}

/* ==========================================
   RESPONSIVE - واکنش‌گرایی
   (اکثر المان‌ها با clamp() به‌صورت پیوسته با سایز صفحه هماهنگ می‌شوند)
========================================== */

@media (max-width: 768px) {

@media (max-width: 480px) {

/* ==========================================
   FALLBACK - برای مرورگرهای قدیمی که از Container Queries
   پشتیبانی نمی‌کنند (اندازه‌های ثابت و امن جایگزین می‌شوند)

@supports not (container-type: inline-size) {

    .menu-card__title { font-size: 18px; }
    .menu-card__arrow { width: 32px; height: 32px; }
    .menu-card__arrow svg { width: 12px; height: 12px; }
}
